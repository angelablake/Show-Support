name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create temporary directory
      run: |
        mkdir temp_dir

    - name: Copy files to temporary directory
      run: |
        find . -maxdepth 1 -not -name 'temp_dir' -not -name '.' -not -name '.git' -not -name '.github' -exec cp -r {} temp_dir/ \;

    - name: Rename directory
      run: |
        mv temp_dir show-support

    - name: Zip the folder
      run: |
        zip -r show-support-${{ github.event.inputs.tag }}.zip show-support \
        -x "*.git/*" "*.github/*" \
        "show-support/composer.json" "show-support/composer.lock" \
        "show-support/package.json" "show-support/package-lock.json" \
        "show-support/phpstan.neon" "show-support/phpstan-baseline.neon" \
        "show-support/postcss.config.js" "show-support/tailwind.config.js" \
        "show-support/gutenberg-market.php" "show-support/.gitignore" \
        "show-support/webpack.config.js" "show-support/src/*"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: show-support-${{ github.event.inputs.tag }}.zip
        tag_name: ${{ github.event.inputs.tag }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write